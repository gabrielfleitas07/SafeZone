<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeZone - Central de Monitoreo</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h1>SafeZone - Centro de Control</h1>
    <p class="description">Monitoreo Seguro en Tiempo Real</p>

    <div class="dashboard">
        <div class="panel" id="panel-receptor">
            <div class="panel-title">🛡️ Central de Confianza (Protector)</div>
            
            <!-- Estado de espera predeterminado -->
            <div class="waiting-state" id="receptor-waiting">
                <span style="font-size: 40px; display: block; margin-bottom: 10px;">🔒</span>
                <p style="margin: 0; font-weight: bold;">Canal Seguro Protegido</p>
                <p style="margin: 5px 0 0 0; font-size: 14px;">Monitoreando actividad de emisores...</p>
            </div>

            <!-- Contenedor dinámico donde se acumularán las alertas en la parte inferior -->
            <div id="alertas-container" style="display: flex; flex-direction: column; gap: 15px; width: 100%; margin-top: 15px;"></div>
        </div>
    </div>  

    <script src="receptor.js"></script>
</body>
</html>

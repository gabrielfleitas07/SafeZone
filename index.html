<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <title>SafeZone - Inicio</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Carga de SDKs de Firebase (Versión 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

    <h1>SafeZone</h1>
    <p class="description">Sistema de Alerta y Monitoreo de Emergencias</p>

    <div class="dashboard">
        <!-- Vista cuando NO está autenticado -->
        <div class="panel" id="auth-logged-out">
            <div class="panel-title">🔑 Iniciar Sesión</div>
            <p style="color: #94A3B8; font-size: 14px; margin-bottom: 20px;">
                Iniciá sesión con Google para acceder al sistema SafeZone.
            </p>
            <button class="btn-cancel" id="btn-login-google" style="background-color: #38BDF8; color: #0F172A; width: 100%;">
                Ingresar con Google
            </button>
        </div>

        <!-- Vista cuando SÍ está autenticado -->
        <div class="panel" id="auth-logged-in" style="display: none; align-items: center; justify-content: space-between; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 12px; text-align: left;">
                <img id="user-photo" src="https://via.placeholder.com/45?text=U" alt="Perfil" style="width: 45px; height: 45px; border-radius: 50%; border: 2px solid #38BDF8;">
                <div>
                    <strong id="user-name" style="display: block; color: #F1F5F9;">Usuario</strong>
                    <span id="user-email" style="font-size: 12px; color: #94A3B8;">correo@ejemplo.com</span>
                </div>
            </div>
            <button id="btn-logout" class="btn-cancel" style="background-color: #EF4444; color: white; padding: 6px 12px; font-size: 13px;">
                Cerrar Sesión
            </button>
        </div>

        <!-- Panel de selección de Rol (Emisor / Receptor) -->
        <div class="panel" id="main-dashboard" style="display: none; flex-direction: column; gap: 20px;">
            <div class="panel-title">⚙️ Seleccionar Modo</div>

            <!-- Opción Emisor -->
            <div style="background-color: #0F172A; padding: 15px; border-radius: 8px; text-align: left;">
                <h3 style="margin: 0 0 10px 0; color: #EF4444; font-size: 16px;">📱 Modo Emisor (Víctima)</h3>
                <label for="receptor-target" style="font-size: 12px; color: #94A3B8; display: block; margin-bottom: 5px;">
                    ID / Correo del Receptor a vincular:
                </label>
                <input type="text" id="receptor-target" placeholder="Ej: ID_o_email_del_receptor" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background-color: #1E293B; color: white; box-sizing: border-box; margin-bottom: 10px;">
                <button id="go-emisor" class="btn-cancel" style="background-color: #EF4444; color: white; width: 100%;">
                    Ir a Pantalla Emisor
                </button>
            </div>

            <!-- Opción Receptor -->
            <div style="background-color: #0F172A; padding: 15px; border-radius: 8px; text-align: left;">
                <h3 style="margin: 0 0 10px 0; color: #38BDF8; font-size: 16px;">🛡️ Modo Receptor (Protector)</h3>
                <p style="font-size: 12px; color: #94A3B8; margin-top: 0;">
                    Accedé a la central para monitorear las alertas entrantes.
                </p>
                <button id="go-receptor" class="btn-cancel" style="background-color: #38BDF8; color: #0F172A; width: 100%;">
                    Ir a Central de Control
                </button>
            </div>
        </div>
    </div>

    <!-- Lógica JavaScript -->
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBzFo4tAspET175kUceKjR8d9-4WeHzUi8",
        authDomain: "safezone-9afe4.firebaseapp.com",
        databaseURL: "https://safezone-9afe4-default-rtdb.firebaseio.com",
        projectId: "safezone-9afe4",
        storageBucket: "safezone-9afe4.firebasestorage.app",
        messagingSenderId: "366054781732",
        appId: "1:366054781732:web:a3fe42d60d90130732b9b1"
    };

    // 1. Inicialización
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 2. FORZAR PERSISTENCIA LOCAL (Evita la pérdida de estado en session/redirect)
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .then(() => {
            console.log("Persistencia LOCAL configurada.");
        })
        .catch((error) => {
            console.error("Error estableciendo persistencia:", error);
        });

    const authOutView = document.getElementById('auth-logged-out');
    const authInView = document.getElementById('auth-logged-in');
    const mainDashboard = document.getElementById('main-dashboard');
    
    let currentUser = null;

    // 3. Listener del estado del usuario (Gestiona el login tanto si entra directo como tras redirección)
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById('user-name').innerText = user.displayName || "Usuario SafeZone";
            document.getElementById('user-email').innerText = user.email || user.uid;
            document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/45?text=U';
            
            authOutView.style.display = 'none';
            authInView.style.display = 'flex';
            mainDashboard.style.display = 'flex';
        } else {
            currentUser = null;
            authOutView.style.display = 'block';
            authInView.style.display = 'none';
            mainDashboard.style.display = 'none';
        }
    });

    // 4. Iniciar sesión obligando a signInWithPopup pero detectando fallos táctiles/móviles
    document.getElementById('btn-login-google').addEventListener('click', () => {
        const provider = new firebase.auth.GoogleAuthProvider();

        auth.signInWithPopup(provider)
            .then((result) => {
                console.log("Sesión iniciada:", result.user);
            })
            .catch((error) => {
                console.error("Error en Popup:", error);
                alert("Error de autenticación: " + error.message);
            });
    });

    // Cerrar Sesión
    document.getElementById('btn-logout').addEventListener('click', () => {
        auth.signOut();
    });

    // Redirección Emisor
    document.getElementById('go-emisor').addEventListener('click', () => {
        if (!currentUser) return;
        const idReceptor = document.getElementById('receptor-target').value.trim();

        if (!idReceptor) {
            alert("Por favor, ingresá el ID o correo del Receptor.");
            return;
        }

        const idEmisor = currentUser.uid;
        const emisorName = currentUser.displayName || currentUser.email || "Emisor";
        window.location.href = `emisor.html?id=${encodeURIComponent(idEmisor)}&receptor=${encodeURIComponent(idReceptor)}&name=${encodeURIComponent(emisorName)}`;
    });

    // Redirección Receptor
    document.getElementById('go-receptor').addEventListener('click', () => {
        if (!currentUser) return;
        
        const idReceptor = currentUser.uid;
        const emailReceptor = currentUser.email || "";
        window.location.href = `receptor.html?id=${encodeURIComponent(idReceptor)}&email=${encodeURIComponent(emailReceptor)}`;
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeZone - Inicio</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Scripts de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Mismos estilos que tenías anteriormente */
        .dashboard .panel { height: auto; min-height: 400px; display: flex; flex-direction: column; }
        .menu-container { display: flex; flex-direction: column; gap: 15px; width: 100%; margin-top: 15px; flex-grow: 1; }
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .form-group label { color: #94A3B8; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input { background-color: #0F172A; border: 2px solid #334155; color: #F8FAFC; padding: 12px 16px; border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-group input:focus { border-color: #38BDF8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-access { width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; margin-top: auto; color: #F8FAFC; transition: transform 0.1s, filter 0.2s; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .btn-access:active { transform: scale(0.98); }
        .btn-emisor { background-color: #EF4444; }
        .btn-emisor:hover { filter: brightness(1.1); }
        .btn-receptor { background-color: #10B981; }
        .btn-receptor:hover { filter: brightness(1.1); }
        
        /* Nuevo estilo para botón de Google */
        .btn-google { background-color: #4285F4; margin-bottom: 15px;}
        .btn-google:hover { filter: brightness(1.1); }
        .user-info { font-size: 14px; color: #38BDF8; margin-bottom: 15px; display: none; word-break: break-all;}
    </style>
</head>
<body>

    <h1>SafeZone</h1>
    <p class="description">Sistema de Alerta y Monitoreo Personalizado en Tiempo Real</p>

    <!-- Botón de autenticación global -->
    <button class="btn-access btn-google" id="btn-login" style="max-width: 400px; margin: 0 auto 20px auto; display: block;">
        Iniciar sesión con Google
    </button>
    <div id="user-info" class="user-info" style="text-align: center; max-width: 400px; margin: 0 auto 20px auto;"></div>

    <div class="dashboard" id="dashboard-content" style="display: none;">
        <div class="panel">
            <div class="panel-title">📱 Modo Emisor (Dispositivo)</div>
            <p style="color: #94A3B8; font-size: 14px; margin: 0 0 15px 0;">Ingresá el correo del protector que va a recibir tus alertas.</p>
            
            <div class="menu-container">
                <div class="form-group">
                    <label for="receptor-target">Correo de tu Receptor (Protector)</label>
                    <input type="email" id="receptor-target" placeholder="ejemplo@gmail.com">
                </div>
                <button class="btn-access btn-emisor" id="go-emisor">Ingresar como Emisor</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">🛡️ Modo Receptor (Centro de Control)</div>
            <p style="color: #94A3B8; font-size: 14px; margin: 0 0 15px 0;">Solo ingresá para escuchar las alertas del emisor que te asignó.</p>
            
            <div class="menu-container">
                <button class="btn-access btn-receptor" id="go-receptor">Ingresar como Receptor</button>
            </div>
        </div>
    </div>

    <script>
        // Copia tu firebaseConfig de emisor.js aquí
        const firebaseConfig = {
            apiKey: "AIzaSyBzFo4tAspET175kUceKjR8d9-4WeHzUi8",
            authDomain: "safezone-9afe4.firebaseapp.com",
            databaseURL: "https://safezone-9afe4-default-rtdb.firebaseio.com",
            projectId: "safezone-9afe4",
            storageBucket: "safezone-9afe4.firebasestorage.app",
            messagingSenderId: "366054781732",
            appId: "1:366054781732:web:a3fe42d60d90130732b9b1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUserEmail = "";

        // Autenticación con Google
        document.getElementById('btn-login').addEventListener('click', () => {
            auth.signInWithPopup(provider).then((result) => {
                currentUserEmail = result.user.email;
                document.getElementById('btn-login').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'flex';
                
                const userInfoDiv = document.getElementById('user-info');
                userInfoDiv.innerHTML = `Sesión iniciada como: <strong>${currentUserEmail}</strong>`;
                userInfoDiv.style.display = 'block';
            }).catch((error) => {
                alert("Error al iniciar sesión: " + error.message);
            });
        });

        // Ingreso como Emisor
        document.getElementById('go-emisor').addEventListener('click', () => {
            const emailReceptor = document.getElementById('receptor-target').value.trim();
            if (!emailReceptor) {
                alert("Ingresá el correo de tu receptor.");
                return;
            }
            // Codificamos los correos para evitar problemas con los caracteres en la URL
            window.location.href = `emisor.html?id=${btoa(currentUserEmail)}&receptor=${btoa(emailReceptor)}`;
        });

        // Ingreso como Receptor
        document.getElementById('go-receptor').addEventListener('click', () => {
            window.location.href = `receptor.html?id=${btoa(currentUserEmail)}`;
        });
    </script>
</body>
</html>
